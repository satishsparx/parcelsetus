
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParcelSetus</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        header {
            background: #1e293b;
            color: white;
            padding: 20px;
            text-align: center;
        }

        main {
            min-height: 75vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 50px 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            max-width: 600px;
        }

        h1 {
            color: #2563eb;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        button {
            background: #2563eb;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background: #1d4ed8;
        }

        footer {
            background: #1e293b;
            color: white;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>

<body>

    <header>
        <h2>Parcel Setus</h2>
    </header>

    <main>
        <div class="container">
            <h1>Welcome to ParcelSetus</h1>

            <p>
                Where you can book the parcels for your customers
            </p>

            <button onclick="showMessage()">
                Click Me
            </button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 ParcelSetus. All rights reserved.</p>
    </footer>

    <script>
        function showMessage() {
            alert("Congratulations! Your website is working successfully.");
        }
    </script>

</body>
</html>
